<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>5-Level Space Shooter Game</title>
    <style>
        body {
            margin: 0;
            background: #0d0d1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas {
            border: 3px solid #4a4e69;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
        }
        .info {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="500"></canvas>
    <div class="info">কন্ট্রোল: Left/Right Arrow = সরান | Spacebar = শুট করুন</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game Settings & Levels
let level = 1;
const maxLevels = 5;
let score = 0;
let gameOver = false;
let gameWon = false;

const levelConfig = {
    1: { enemySpeed: 1.5, spawnRate: 90, targetScore: 10 },
    2: { enemySpeed: 2.2, spawnRate: 75, targetScore: 25 },
    3: { enemySpeed: 3.0, spawnRate: 60, targetScore: 45 },
    4: { enemySpeed: 3.8, spawnRate: 45, targetScore: 70 },
    5: { enemySpeed: 4.8, spawnRate: 30, targetScore: 100 }
};

// Player Ship
const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 50,
    width: 40,
    height: 30,
    speed: 6
};

// Controls
const keys = {};
document.addEventListener("keydown", (e) => { keys[e.code] = true; });
document.addEventListener("keyup", (e) => { keys[e.code] = false; });

// Bullets and Enemies
let bullets = [];
let enemies = [];
let frameCount = 0;

function shootBullet() {
    bullets.push({
        x: player.x + player.width / 2 - 3,
        y: player.y,
        width: 6,
        height: 12,
        speed: 8
    });
}

// Keydown event for Space shooting (single shot per press)
document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !gameOver && !gameWon) {
        shootBullet();
    }
});

function spawnEnemy() {
    const config = levelConfig[level];
    enemies.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        width: 30,
        height: 30,
        speed: config.enemySpeed
    });
}

function update() {
    if (gameOver || gameWon) return;

    frameCount++;

    // Move Player
    if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
    if (keys["ArrowRight"] && player.x < canvas.width - player.width) player.x += player.speed;

    // Move Bullets
    bullets.forEach((bullet, index) => {
        bullet.y -= bullet.speed;
        if (bullet.y < 0) bullets.splice(index, 1);
    });

    // Spawn Enemies
    if (frameCount % levelConfig[level].spawnRate === 0) {
        spawnEnemy();
    }

    // Move Enemies
    enemies.forEach((enemy, eIndex) => {
        enemy.y += enemy.speed;

        // Enemy Reaches Bottom (Game Over)
        if (enemy.y > canvas.height) {
            gameOver = true;
        }

        // Check Collision with Player
        if (
            player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y
        ) {
            gameOver = true;
        }

        // Check Collision with Bullets
        bullets.forEach((bullet, bIndex) => {
            if (
                bullet.x < enemy.x + enemy.width &&
                bullet.x + bullet.width > enemy.x &&
                bullet.y < enemy.y + enemy.height &&
                bullet.y + bullet.height > enemy.y
            ) {
                enemies.splice(eIndex, 1);
                bullets.splice(bIndex, 1);
                score += 1;

                // Level Up Check
                if (score >= levelConfig[level].targetScore) {
                    if (level < maxLevels) {
                        level++;
                    } else {
                        gameWon = true;
                    }
                }
            }
        });
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver && !gameWon) {
        // Draw Player (Green Ship)
        ctx.fillStyle = "#00ff88";
        ctx.fillRect(player.x, player.y, player.width, player.height);

        // Draw Bullets (Yellow)
        ctx.fillStyle = "#ffea00";
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        // Draw Enemies (Red)
        ctx.fillStyle = "#ff3366";
        enemies.forEach(e => ctx.fillRect(e.x, e.y, e.width, e.height));

        // Draw UI
        ctx.fillStyle = "#fff";
        ctx.font = "16px sans-serif";
        ctx.fillText(`Score: ${score}`, 15, 25);
        ctx.fillText(`Level: ${level}/${maxLevels}`, canvas.width / 2 - 35, 25);
        ctx.fillText(`Target: ${levelConfig[level].targetScore}`, canvas.width - 100, 25);
    } else if (gameOver) {
        ctx.fillStyle = "#ff3366";
        ctx.font = "36px sans-serif";
        ctx.fillText("GAME OVER!", canvas.width / 2 - 110, canvas.height / 2);
        ctx.fillStyle = "#fff";
        ctx.font = "18px sans-serif";
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2 - 55, canvas.height / 2 + 40);
    } else if (gameWon) {
        ctx.fillStyle = "#00ff88";
        ctx.font = "32px sans-serif";
        ctx.fillText("YOU COMPLETED ALL 5 LEVELS!", canvas.width / 2 - 230, canvas.height / 2);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
