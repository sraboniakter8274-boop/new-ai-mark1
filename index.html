<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Ai Mark1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .power-btn {
            width: 220px;
            height: 70px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(255, 75, 43, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .power-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 75, 43, 0.6);
        }

        .power-btn:active {
            transform: translateY(2px);
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
        }
    </style>
</head>
<body>

    <button class="power-btn" onclick="speakAI()">POWER</button>

    <script>
        function speakAI() {
            const text = "আসসালামু আলাইকুম, কেমন আছেন মাস্টার?";
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // আগের কথা বন্ধ করার জন্য

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD'; // বাংলা ভাষা
                utterance.pitch = 1.3;     // গলার সুর মিষ্টি ও মেয়েদের মতো করার জন্য
                utterance.rate = 0.9;      // কথা বলার গতি

                // ব্রাউজারের উপলব্ধ ভয়েস নির্বাচন
                const voices = window.speechSynthesis.getVoices();
                const femaleVoice = voices.find(voice => voice.lang.includes('bn') || voice.name.includes('Female') || voice.name.includes('Google'));
                
                if (femaleVoice) {
                    utterance.voice = femaleVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                alert("আপনার ব্রাউজারে স্পিচ সাপোর্ট নেই।");
            }
        }

        // ভয়েস লোড হওয়া নিশ্চিত করা
        window.speechSynthesis.onvoiceschanged = function() {
            window.speechSynthesis.getVoices();
        };
    </script>

</body>
</html>
